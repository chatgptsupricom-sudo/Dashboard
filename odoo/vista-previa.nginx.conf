server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Son copias del sitio: que Google no las indexe como contenido duplicado.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # La raíz abre la página de inicio nueva; la vista previa sobre el sitio actual queda en /vista-previa/.
    location = / {
        return 302 /landing/;
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
