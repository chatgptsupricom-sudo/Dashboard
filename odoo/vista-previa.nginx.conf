server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Son copias del sitio: que Google no las indexe como contenido duplicado.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        return 302 /vista-previa/;
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
