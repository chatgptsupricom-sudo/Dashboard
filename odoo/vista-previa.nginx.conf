# La copia de prueba (dominio de EasyPanel) no se indexa; el dominio propio de la tienda, sí.
map $host $robots_tienda {
    ~\.easypanel\.host$  "noindex, nofollow";
    ~^localhost          "noindex, nofollow";
    default              "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Sin valor nginx no manda la cabecera: solo la copia de prueba lleva noindex.
    add_header X-Robots-Tag $robots_tienda always;

    # Las etiquetas para compartir (og:image) y robots.txt necesitan la dirección completa del sitio.
    sub_filter_types text/plain;
    sub_filter '__ORIGEN__' 'https://$host';
    sub_filter_once off;

    # Para resolver el panel en proxy_pass con variables.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # La raíz abre la página de inicio nueva; la vista previa sobre el sitio actual queda en /vista-previa/.
    location = / {
        return 302 /landing/;
    }

    # Enlace para compartir un producto: WhatsApp, Facebook y Google leen la vista previa (foto, nombre) que arma
    # el panel; a una persona la manda a la ficha (lib/tienda-web/seo.ts del panel).
    location ~ ^/p/(\d+)$ {
        set $producto $1;
        set $panel "panel.supricom.com.ve";
        add_header X-Robots-Tag $robots_tienda always;
        proxy_pass https://$panel/api/tienda-web/compartir?id=$producto&$args;
        proxy_set_header Host $panel;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # El mapa del sitio con todos los productos publicados (lo arma el panel).
    location = /sitemap.xml {
        set $panel "panel.supricom.com.ve";
        proxy_pass https://$panel/api/tienda-web/sitemap;
        proxy_set_header Host $panel;
        proxy_ssl_server_name on;
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
