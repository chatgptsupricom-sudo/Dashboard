<!--
  Botón destacado "Servicio Técnico" para el sitio de Supricom.
  Uso: pegar en una sección de la home, en una página de servicio al cliente,
  o como shortcode en el editor de WordPress.

  URL publica del portal: https://panel.supricom.com.ve
  Para pruebas internas usar el host actual del deploy (panel de pruebas).

  Reemplazar:
    - /es/  por el idioma activo del sitio (es/en)

  Probado en Chrome/Safari/Firefox desktop y mobile.
-->
<a
  href="https://panel.supricom.com.ve/es/servicio-tecnico"
  class="supricom-st-btn supricom-st-btn-primary"
  style="
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.875rem 1.5rem;
    background-color: #741DFE;
    color: #FFFFFF;
    font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.2;
    text-decoration: none;
    border-radius: 10px;
    border: 1px solid #741DFE;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    box-shadow: 0 1px 2px rgba(116, 29, 254, 0.12);
  "
  onmouseover="this.style.backgroundColor='#5e17c9'; this.style.borderColor='#5e17c9'; this.style.transform='translateY(-1px)';"
  onmouseout="this.style.backgroundColor='#741DFE'; this.style.borderColor='#741DFE'; this.style.transform='translateY(0)';"
>
  <!-- Icono: Wrench (llave inglesa) -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
  </svg>
  <span>Servicio Técnico</span>
</a>
